name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "✅ Xcode project generated"
          ls -la MusicApp.xcodeproj

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MusicApp.xcodeproj \
            -scheme MusicApp

      - name: Build app
        run: |
          xcodebuild build \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Create IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "MusicApp.app" -type d | head -1)
          echo "App found at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MusicApp.ipa Payload
          rm -rf Payload
          echo "✅ IPA created: $(ls -lh MusicApp.ipa | awk '{print $5}')"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Unsigned
          path: MusicApp.ipa
          retention-days: 30

      - name: Build Summary
        run: |
          echo "========================================="
          echo "  🎵 MusicApp Build Complete!"
          echo "========================================="
          echo "  📱 IPA Size: $(ls -lh MusicApp.ipa | awk '{print $5}')"
          echo "  ⚠️ IPA is unsigned - sign with SideStore/AltStore"
          echo "========================================="======"
