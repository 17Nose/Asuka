     - name: Build app
        run: |
          xcodebuild build \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build.log
        continue-on-error: true

      - name: Show build errors
        if: always()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -E "error:|warning:" build.log | head -30 || echo "No errors found in log"
