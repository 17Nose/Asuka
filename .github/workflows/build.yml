name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "✅ Xcode project generated"

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MusicApp.xcodeproj \
            -scheme MusicApp

      - name: Archive app
        run: |
          xcodebuild archive \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ./MusicApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO

      - name: Verify archive
        run: |
          echo "Archive contents:"
          ls -la MusicApp.xcarchive/Products/Applications/
          echo ""
          echo "App contents:"
          APP_PATH=$(find MusicApp.xcarchive -name "*.app" -type d | head -1)
          ls -la "$APP_PATH"
          echo ""
          echo "Executable check:"
          ls -la "$APP_PATH/MusicApp" 2>/dev/null && file "$APP_PATH/MusicApp" || echo "WARNING: No MusicApp binary!"

      - name: Create IPA
        run: |
          APP_PATH=$(find MusicApp.xcarchive -name "*.app" -type d | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MusicApp.ipa Payload
          rm -rf Payload
          echo "✅ IPA created: $(ls -lh MusicApp.ipa | awk '{print $5}')"
          echo ""
          echo "IPA contents:"
          unzip -l MusicApp.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Unsigned
          path: MusicApp.ipa
          retention-days: 30
