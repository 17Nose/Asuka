name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "✅ 项目已生成"
          echo "--- 项目中的 Swift 文件引用数 ---"
          grep -o '[A-Za-z]*\.swift' MusicApp.xcodeproj/project.pbxproj | sort -u | wc -l

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MusicApp.xcodeproj \
            -scheme MusicApp

      - name: Archive app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/MusicApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_DEBUG_DYLIB=NO \
            ENABLE_PREVIEWS=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee archive.log

      - name: Locate and verify app
        run: |
          exec > >(tee verify.log) 2>&1
          echo "=== 查找 .app 目录 ==="
          find ./build -name "*.app" -type d 2>/dev/null || echo "(未找到 .app)"

          APP_PATH="./build/MusicApp.xcarchive/Products/Applications/MusicApp.app"
          echo ""
          echo "=== App 内容 ==="
          ls -la "$APP_PATH" || { echo "❌ 路径不存在"; exit 1; }

          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || echo "")
          echo ""
          echo "CFBundleExecutable = ${EXEC_NAME:-<缺失>}"

          if [ -n "$EXEC_NAME" ] && [ -f "$APP_PATH/$EXEC_NAME" ]; then
            echo "✅ 可执行文件存在"
            file "$APP_PATH/$EXEC_NAME"
            lipo -archs "$APP_PATH/$EXEC_NAME" 2>/dev/null || true
          else
            echo "❌ 可执行文件缺失"
            echo "--- 在归档中全局搜索 MusicApp 可执行文件 ---"
            find ./build -name "$EXEC_NAME" -type f 2>/dev/null || echo "(全库未找到)"
            exit 1
          fi

          echo ""
          echo "=== Info.plist 功能校验 ==="
          PLIST_FAIL=0
          check_key() {
            local value
            value=$(/usr/libexec/PlistBuddy -c "Print :$1" "$APP_PATH/Info.plist" 2>/dev/null | tr '\n' ' ')
            if [ -n "$value" ]; then
              echo "✅ $1 = $value"
            else
              echo "❌ $1 缺失"
              PLIST_FAIL=1
            fi
          }
          check_key UIFileSharingEnabled
          check_key LSSupportsOpeningDocumentsInPlace
          check_key UIBackgroundModes

          echo ""
          echo "=== 内置音乐目录 ==="
          if [ -d "$APP_PATH/Music" ]; then
            echo "✅ Music 目录已打包："
            ls -la "$APP_PATH/Music" | head -20
          else
            echo "⚠️ 无内置 Music 目录（Resources/Music 为空时属正常）"
          fi

          if [ "$PLIST_FAIL" != "0" ]; then
            echo "❌ Info.plist 缺少必要配置，文件共享将不可用"
            exit 1
          fi

      - name: Create IPA
        run: |
          APP_PATH="./build/MusicApp.xcarchive/Products/Applications/MusicApp.app"
          rm -rf Payload MusicApp.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          xattr -cr Payload || true
          zip -r -X -y MusicApp.ipa Payload
          zip -d MusicApp.ipa "__MACOSX/*" 2>/dev/null || true
          rm -rf Payload

          echo "=== IPA 内容 ==="
          unzip -l MusicApp.ipa
          echo ""
          echo "📦 大小: $(ls -lh MusicApp.ipa | awk '{print $5}')"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Unsigned
          path: MusicApp.ipa
          retention-days: 30

      - name: Build Summary
        run: |
          echo "🎵 编译完成 MusicApp.ipa"

      # 放在最后：任一前置步骤失败都会执行，把日志回传到仓库便于诊断
      - name: Publish diagnostics
        if: failure()
        run: |
          {
            echo "=== 编译错误 (archive.log) ==="
            grep -E "error:" archive.log 2>/dev/null | head -80 || echo "(无 error: 行)"
            echo ""
            echo "=== verify.log ==="
            cat verify.log 2>/dev/null || echo "(verify 未执行)"
            echo ""
            echo "=== archive.log 末尾 60 行 ==="
            tail -60 archive.log 2>/dev/null || true
          } > BUILD_ERRORS.txt

          git config user.email "ci@github.com"
          git config user.name "CI"
          git add -f BUILD_ERRORS.txt
          git commit -m "ci: build diagnostics [skip ci]" || true
          git push || true
