name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "✅ Xcode project generated"

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MusicApp.xcodeproj \
            -scheme MusicApp

      - name: Build app
        run: |
          xcodebuild build \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build.log

      - name: Diagnose app bundle
        run: |
          APP_PATH="./DerivedData/Build/Products/Debug-iphoneos/MusicApp.app"

          echo "========================================"
          echo "  1. App Bundle 完整内容"
          echo "========================================"
          ls -la "$APP_PATH"

          echo ""
          echo "========================================"
          echo "  2. Info.plist 关键字段"
          echo "========================================"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" || echo "❌ CFBundleExecutable 缺失"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" || echo "❌ CFBundleIdentifier 缺失"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$APP_PATH/Info.plist" || echo "❌ CFBundleName 缺失"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist" || echo "(无 CFBundleDisplayName)"

          echo ""
          echo "========================================"
          echo "  3. 可执行文件校验"
          echo "========================================"
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          if [ -f "$APP_PATH/$EXEC_NAME" ]; then
            echo "✅ 可执行文件存在: $EXEC_NAME"
            file "$APP_PATH/$EXEC_NAME"
          else
            echo "❌ 可执行文件不存在: $EXEC_NAME"
            exit 1
          fi

      - name: Create clean IPA
        run: |
          APP_PATH="./DerivedData/Build/Products/Debug-iphoneos/MusicApp.app"

          rm -rf Payload MusicApp.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          xattr -cr Payload || true

          zip -r -X -y MusicApp.ipa Payload

          zip -d MusicApp.ipa "__MACOSX/*" 2>/dev/null || true

          rm -rf Payload

          echo "========================================"
          echo "  IPA 内容清单"
          echo "========================================"
          unzip -l MusicApp.ipa

          echo ""
          echo "  📦 大小: $(ls -lh MusicApp.ipa | awk '{print $5}')"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Unsigned
          path: MusicApp.ipa
          retention-days: 30

      - name: Build Summary
        run: |
          echo "========================================="
          echo "  🎵 MusicApp 编译完成!"
          echo "  📱 IPA: MusicApp.ipa"
          echo "========================================="
