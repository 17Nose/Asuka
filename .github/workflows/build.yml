name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MusicApp.xcodeproj \
            -scheme MusicApp

      - name: Build app
        run: |
          xcodebuild build \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            STRIP_INSTALLED_PRODUCT=NO \
            DEPLOYMENT_POSTPROCESSING=NO \
            MACH_O_TYPE=mh_execute

      - name: Verify binary exists
        run: |
          APP_PATH=$(find ./DerivedData -name "MusicApp.app" -type d | head -1)
          echo "App: $APP_PATH"
          echo ""
          echo "App contents:"
          ls -la "$APP_PATH/"
          echo ""
          if [ -f "$APP_PATH/MusicApp" ]; then
            echo "✅ Binary OK: $(file "$APP_PATH/MusicApp")"
          else
            echo "❌ Binary NOT found in .app!"
            echo "Searching for binary..."
            find ./DerivedData -name "MusicApp" -type f | head -5
            # Copy binary from Build dir if needed
            BIN=$(find ./DerivedData -name "MusicApp" -type f -not -path "*.app/*" | head -1)
            if [ -n "$BIN" ]; then
              echo "Found binary outside app: $BIN"
              cp "$BIN" "$APP_PATH/MusicApp"
              echo "✅ Copied binary into app"
            fi
          fi

      - name: Create IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "MusicApp.app" -type d | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MusicApp.ipa Payload
          rm -rf Payload
          echo "✅ Done: $(ls -lh MusicApp.ipa | awk '{print $5}')"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Unsigned
          path: MusicApp.ipa
          retention-days: 30
