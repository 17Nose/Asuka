name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    env:
      SCHEME: Rin
      ARCHIVE_PATH: ./build/Rin.xcarchive
      APP_PATH: ./build/Rin.xcarchive/Products/Applications/Rin.app
      IPA_NAME: Rin.ipa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "✅ 项目已生成"
          ls -d Rin.xcodeproj

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Rin.xcodeproj \
            -scheme "$SCHEME"

      - name: Archive app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Rin.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_DEBUG_DYLIB=NO \
            ENABLE_PREVIEWS=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee archive.log

      - name: Locate and verify app
        run: |
          exec > >(tee verify.log) 2>&1

          echo "=== App 内容 ==="
          ls -la "$APP_PATH" || { echo "❌ 路径不存在"; exit 1; }

          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || echo "")
          echo ""
          echo "CFBundleExecutable = ${EXEC_NAME:-<缺失>}"

          if [ -n "$EXEC_NAME" ] && [ -f "$APP_PATH/$EXEC_NAME" ]; then
            echo "✅ 可执行文件存在"
            lipo -archs "$APP_PATH/$EXEC_NAME" 2>/dev/null || true
          else
            echo "❌ 可执行文件缺失"
            find ./build -name "$EXEC_NAME" -type f 2>/dev/null || echo "(全库未找到)"
            exit 1
          fi

          echo ""
          echo "=== Info.plist 功能校验 ==="
          PLIST_FAIL=0
          check_key() {
            local value
            value=$(/usr/libexec/PlistBuddy -c "Print :$1" "$APP_PATH/Info.plist" 2>/dev/null | tr '\n' ' ')
            if [ -n "$value" ]; then
              echo "✅ $1 = $value"
            else
              echo "❌ $1 缺失"
              PLIST_FAIL=1
            fi
          }
          check_key UIFileSharingEnabled
          check_key LSSupportsOpeningDocumentsInPlace
          check_key UIBackgroundModes
          check_key CFBundleDisplayName
          check_key CFBundleIdentifier

          echo ""
          echo "=== App 图标校验 ==="
          if ls "$APP_PATH"/AppIcon*.png >/dev/null 2>&1 || [ -f "$APP_PATH/Assets.car" ]; then
            echo "✅ 图标已打包："
            ls -la "$APP_PATH"/AppIcon*.png 2>/dev/null || echo "  (无独立 PNG，图标已编译进 Assets.car)"
            if [ -f "$APP_PATH/Assets.car" ]; then
              echo "  Assets.car: $(ls -lh "$APP_PATH/Assets.car" | awk '{print $5}')"
            fi
          else
            echo "❌ 未找到任何图标产物（AppIcon*.png / Assets.car 均缺失）"
            PLIST_FAIL=1
          fi

          echo ""
          echo "=== 内置音乐目录 ==="
          if [ -d "$APP_PATH/Music" ]; then
            echo "✅ Music 目录已打包："
            ls -la "$APP_PATH/Music" | head -20
          else
            echo "⚠️ 无内置 Music 目录（Resources/Music 为空时属正常）"
          fi

          if [ "$PLIST_FAIL" != "0" ]; then
            echo "❌ 校验未通过"
            exit 1
          fi

      - name: Create IPA
        run: |
          rm -rf Payload "$IPA_NAME"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          xattr -cr Payload || true
          zip -r -X -y "$IPA_NAME" Payload
          zip -d "$IPA_NAME" "__MACOSX/*" 2>/dev/null || true
          rm -rf Payload

          echo "=== IPA 内容 ==="
          unzip -l "$IPA_NAME"
          echo ""
          echo "📦 大小: $(ls -lh "$IPA_NAME" | awk '{print $5}')"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Rin-Unsigned
          path: Rin.ipa
          retention-days: 30

      - name: Build Summary
        run: echo "🎵 Rin 编译完成"

      # 放在最后：任一前置步骤失败都会执行，把日志回传到仓库便于诊断
      - name: Publish diagnostics
        if: failure()
        run: |
          {
            echo "=== 编译错误 (archive.log) ==="
            grep -E "error:" archive.log 2>/dev/null | head -80 || echo "(无 error: 行)"
            echo ""
            echo "=== verify.log ==="
            cat verify.log 2>/dev/null || echo "(verify 未执行)"
            echo ""
            echo "=== archive.log 末尾 60 行 ==="
            tail -60 archive.log 2>/dev/null || true
          } > BUILD_ERRORS.txt

          git config user.email "ci@github.com"
          git config user.name "CI"
          git add -f BUILD_ERRORS.txt
          git commit -m "ci: build diagnostics [skip ci]" || true
          git push || true
