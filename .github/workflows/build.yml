name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build configuration'
        type: choice
        options: ['debug', 'release']
        default: 'debug'

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd $GITHUB_WORKSPACE
          xcodegen generate
          echo "✅ Xcode project generated"

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MusicApp.xcodeproj \
            -scheme MusicApp

      - name: Build app (Debug)
        if: ${{ github.event.inputs.build_config == 'debug' || github.event.inputs.build_config == '' }}
        run: |
          xcodebuild build \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Build app (Release)
        if: ${{ github.event.inputs.build_config == 'release' }}
        run: |
          xcodebuild build \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Find .app bundle
        id: find_app
        run: |
          APP_PATH=$(find ./DerivedData -name "MusicApp.app" -type d | head -1)
          echo "App found at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Create Payload and IPA
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MusicApp.ipa Payload
          rm -rf Payload
          echo "✅ IPA created: $(ls -lh MusicApp.ipa | awk '{print $5}')"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Unsigned
          path: MusicApp.ipa
          retention-days: 30

      - name: Build Summary
        run: |
          echo "========================================="
          echo "  🎵 MusicApp Build Complete!"
          echo "========================================="
          echo "  IPA: MusicApp.ipa"
          echo "  Size: $(ls -lh MusicApp.ipa | awk '{print $5}')"
          echo ""
          echo "  ⚠️ This IPA is unsigned."
          echo "  Sign it with AltStore / SideStore / 爱思助手"
          echo "  then install on your iPhone."
          echo "========================================="
