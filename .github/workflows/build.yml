name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "✅ Xcode project generated"

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MusicApp.xcodeproj \
            -scheme MusicApp

      - name: Build app
        run: |
          xcodebuild build \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build.log

      - name: Show build errors
        run: |
          echo "=== BUILD ERRORS ==="
          grep -E "error:" build.log | head -30 || echo "No errors found"

      - name: Create IPA
        run: |
          APP_PATH="./DerivedData/Build/Products/Debug-iphoneos/MusicApp.app"

          echo "=== 检查 App Bundle ==="
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ 未在预期路径找到 App Bundle"
            find ./DerivedData -name "*.app" -type d
            exit 1
          fi

          echo "📦 App 路径: $APP_PATH"
          ls -la "$APP_PATH"

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "❌ Info.plist 缺失！"
            exit 1
          fi
          echo "✅ Info.plist 存在"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MusicApp.ipa Payload
          rm -rf Payload

          echo "=== IPA 内容 ==="
          unzip -l MusicApp.ipa | head -20
          echo "✅ IPA 大小: $(ls -lh MusicApp.ipa | awk '{print $5}')"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-Unsigned
          path: MusicApp.ipa
          retention-days: 30

      - name: Build Summary
        run: |
          echo "========================================="
          echo "  🎵 MusicApp 编译完成!"
          echo "  📱 IPA: MusicApp.ipa"
          echo "  ⚠️ 未签名，请用 Sideloadly / SideStore 签名"
          echo "========================================="
