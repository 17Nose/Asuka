name: MusicApp
options:
  bundleIdPrefix: com.musicapp
  deploymentTarget:
    iOS: "16.0"

targets:
  MusicApp:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Modules
      - UI
      - Utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicapp.player
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Kingfisher
        product: Kingfisher
    info:
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        NSAppleMusicUsageDescription: "需要访问您的音乐库"
        NSDocumentsFolderUsageDescription: "需要访问文档目录"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: "MusicApp"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.29.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "7.12.0"
