name: MusicApp
options:
  bundleIdPrefix: com.musicapp
  deploymentTarget:
    iOS: "16.0"

targets:
  MusicApp:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Modules
      - UI
      - Utilities
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.musicapp.player
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        INFOPLIST_KEY_UILaunchScreen: ""
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: "audio"
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Kingfisher
        product: Kingfisher

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.29.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "7.12.0"
