name: MusicApp
options:
  bundleIdPrefix: com.musicapp
  deploymentTarget:
    iOS: "16.0"

targets:
  MusicApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Modules
      - path: UI
      - path: Utilities
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.musicapp.player

        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "MusicApp"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIBackgroundModes: "audio"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "需要访问您的音乐库以播放本地音乐文件"

        ENABLE_DEBUG_DYLIB: "NO"
        ENABLE_PREVIEWS: "NO"

        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Kingfisher
        product: Kingfisher

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.29.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "7.12.0"
