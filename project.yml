name: Rin
options:
  bundleIdPrefix: com.rin
  deploymentTarget:
    iOS: "16.0"

targets:
  Rin:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Modules
      - path: UI
      - path: Utilities
      # App 图标 / 颜色等资源目录
      - path: Resources/Assets.xcassets
      # 内置音乐：作为「文件夹引用」整体拷入 app bundle，
      # 保留 Music/ 子目录结构，App 内按 Bundle/Resources/Music 查找
      - path: Resources/Music
        type: folder
        buildPhase: resources

    # 显式生成 Info.plist（INFOPLIST_KEY_* 只支持 Xcode 预定义的键，
    # UIFileSharingEnabled 这类自定义键必须走 info.properties）
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Rin
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"

        # SwiftUI 生命周期
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}

        # 后台播放
        UIBackgroundModes:
          - audio

        # 文件共享：让 Documents 出现在「文件」App / 爱思助手 / Finder
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppleMusicUsageDescription: "需要访问您的音乐库以播放本地音乐文件"

    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.rin.player
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        ENABLE_DEBUG_DYLIB: "NO"
        ENABLE_PREVIEWS: "NO"

        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

    dependencies:
      - package: GRDB
        product: GRDB
      - package: Kingfisher
        product: Kingfisher

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.29.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "7.12.0"
